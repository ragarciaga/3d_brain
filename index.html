<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!--
      Los enlaces dentro del sitio mandan solo el origen como referrer: así el código personal del modo
      revisión (?r=) no viaja en el referrer de una pestaña nueva (docs/adr/0015-analitica-sin-cookies.md).
    -->
    <meta name="referrer" content="strict-origin" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      Pide el modelo 3D desde el primer instante (#83), en paralelo con el código. La ruta debe
      coincidir con URL_MODELO en src/components/Visor.tsx. El atributo crossorigin es obligatorio:
      sin él, el fetch de three (modo cors) no reutiliza la descarga y el modelo se baja dos veces.
      Sin atributo type: un tipo no reconocido hace que el navegador ignore la precarga.
    -->
    <link rel="preload" href="/modelos/atlas.glb" as="fetch" crossorigin />
    <meta name="description" content="Maysa Brain: atlas 3D del cerebro y el nervio vago / 3D atlas of the brain and the vagus nerve" />
    <title>Maysa Brain: atlas 3D del cerebro y el nervio vago</title>
    <script>
      // Tema antes de pintar, para que no parpadee (la lógica completa vive en src/lib/tema.ts).
      (function () {
        var t = null;
        try {
          t = localStorage.getItem('atlas:tema');
        } catch (e) {}
        if (t !== 'claro' && t !== 'oscuro') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'oscuro' : 'claro';
        document.documentElement.dataset.tema = t;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
